<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A browser-local converter for common image, media, text, data, and ZIP formats."
    />
    <link rel="icon" type="image/jpeg" href="/favicon.jpg" />
    <meta name="theme-color" content="#070708" />
    <title>File converter — Marfeyx</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module">
      if (location.protocol === "file:") {
        document.body.innerHTML =
          '<main style="min-height:100vh;display:grid;place-items:center;padding:24px;background:#070708;color:#f6f5fb;font:16px/1.6 system-ui,sans-serif;text-align:center"><div><h1 style="margin:0 0 10px;font-size:28px">Start the local preview</h1><p style="margin:0;color:#9a97a6">Run <code style="color:#c4b5fd">npm run dev</code>, then open <strong>http://127.0.0.1:5500</strong>.</p></div></main>';
      } else {
        const isLocalHost = location.hostname === "127.0.0.1" || location.hostname === "localhost";
        const isStaticPreview = isLocalHost && !location.pathname.includes("/dist/");

        if (isStaticPreview) {
          const hasViteClient = Array.from(document.scripts).some((script) =>
            script.src.includes("/@vite/client"),
          );
          if (!hasViteClient) {
            location.replace(new URL("./dist/index.html", location.href));
          } else {
            await import("/src/main.tsx");
          }
        } else {
          await import("/src/main.tsx");
        }
      }
    </script>
  </body>
</html>
